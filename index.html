/* ============================================================
   GET ELEMENTS
============================================================ */

const backgroundSelect =

  );


const resetButton =

  );


const deselectAllButton =

  );



/* ============================================================
   ROUND ORDER
============================================================ */

const rounds = [

  "round1",

  "round2",

  "quarterfinal",

  "semifinal",

  "final"

];



/* ============================================================
   TOURNAMENT STATE
============================================================ */

let tournamentState =
  JSON.parse(
    localStorage.getItem(
      "tennisTournamentState"
    )
  );



/* ============================================================
   INITIALIZE TOURNAMENT
============================================================ */

function initializeTournament() {


  if (!tournamentState) {

    tournamentState = {};

  }


  rounds.forEach(
    round => {


      if (
        !tournamentState[round]
      ) {

        tournamentState[round] = {};

      }


      rackets.forEach(
        (_, index) => {


          if (
            tournamentState[
              round
            ][index] === undefined
          ) {

            tournamentState[
              round
            ][index] = true;

          }

        }
      );

    }
  );


  saveTournament();

}


function saveTournament() {

  localStorage.setItem(

    "tennisTournamentState",

    JSON.stringify(
      tournamentState
    )

  );

}


initializeTournament();



/* ============================================================
   GET PREVIOUS ROUND
============================================================ */

function getPreviousRound(
  currentRound
) {


  const index =
    rounds.indexOf(
      currentRound
    );


  if (index <= 0) {

    return null;

  }


  return rounds[
    index - 1
  ];

}



/* ============================================================
   GET RACKETS AVAILABLE FOR ROUND
============================================================ */

function getAvailableRackets(
  round
) {


  const previousRound =
    getPreviousRound(
      round
    );


  /*
  Round 1:

  Everyone is available.
  */

  if (!previousRound) {

    return rackets.map(
      (_, index) => index
    );

  }


  /*
  Later rounds:

  Only previous-round survivors
  are available.
  */

  return rackets
    .map(
      (_, index) => {


        if (
          tournamentState[
            previousRound
          ][index] === true
        ) {

          return index;

        }


        return null;

      }
    )
    .filter(
      index =>
        index !== null
    );

}



/* ============================================================
   GET SURVIVORS
============================================================ */

function getCurrentSurvivors(
  round
) {


  return getAvailableRackets(
    round
  ).filter(
    index =>

      tournamentState[
        round
      ][index] === true

  );

}



/* ============================================================
   RENDER MANAGEMENT
============================================================ */

function renderManagement() {


  const round =
    managementRound.value;


  const available =
    getAvailableRackets(
      round
    );


  managementList.innerHTML =
    "";


  /*
  No rackets available.
  */

  if (
    available.length === 0
  ) {

    managementList.innerHTML = `

      <div class="p-4 text-sm text-gray-500">

        No rackets are available for this round.

      </div>

    `;


    updateRemainingCount();

    return;

  }



  available.forEach(
    index => {


      const racket =
        rackets[index];


      const checked =
        tournamentState[
          round
        ][index] === true;



      const row =
        document.createElement(
          "label"
        );


      row.className = `

        flex
        items-center
        gap-3
        p-3
        border-b
        last:border-b-0
        cursor-pointer
        hover:bg-gray-50

      `;



      const checkbox =
        document.createElement(
          "input"
        );


      checkbox.type =
        "checkbox";


      checkbox.checked =
        checked;


      checkbox.className =
        "w-5 h-5";



      checkbox.addEventListener(
        "change",
        () => {


          tournamentState[
            round
          ][index] =
            checkbox.checked;


          saveTournament();


          renderManagement();


          populateRacketDropdowns();

        }
      );



      const name =
        document.createElement(
          "span"
        );


      name.textContent =
        racket.name;


      name.className =
        "text-sm text-gray-800";



      row.appendChild(
        checkbox
      );


      row.appendChild(
        name
      );


      managementList.appendChild(
        row
      );

    }
  );


  updateRemainingCount();

}



/* ============================================================
   REMAINING COUNT
============================================================ */

function updateRemainingCount() {


  const round =
    managementRound.value;


  const available =
    getAvailableRackets(
      round
    );


  const survivors =
    getCurrentSurvivors(
      round
    );


  remainingCount.textContent =

    `${survivors.length} of ${available.length} rackets remaining`;

}



/* ============================================================
   POPULATE MATCHUP DROPDOWNS
============================================================ */

function populateRacketDropdowns() {


  /*
  Remember current selections.
  */

  const previous1 =
    racket1Select.value;


  const previous2 =
    racket2Select.value;



  /*
  Clear dropdowns.
  */

  racket1Select.innerHTML = `

    <option value="">
      Select first racket
    </option>

  `;


  racket2Select.innerHTML = `

    <option value="">
      Select second racket
    </option>

  `;



  /*
  Current round.
  */

  const round =
    managementRound.value;



  /*
  Current survivors.
  */

  const survivors =
    getCurrentSurvivors(
      round
    );



  /*
  Add survivors.
  */

  survivors.forEach(
    index => {


      const racket =
        rackets[index];



      const option1 =
        document.createElement(
          "option"
        );


      option1.value =
        index;


      option1.textContent =
        racket.name;


      racket1Select.appendChild(
        option1
      );



      const option2 =
        document.createElement(
          "option"
        );


      option2.value =
        index;


      option2.textContent =
        racket.name;


      racket2Select.appendChild(
        option2
      );

    }
  );



  /*
  Restore previous selections
  if still available.
  */

  if (
    survivors.includes(
      Number(previous1)
    )
  ) {

    racket1Select.value =
      previous1;

  }


  if (
    survivors.includes(
      Number(previous2)
    )
  ) {

    racket2Select.value =
      previous2;

  }



  updateDisplay();

}



/* ============================================================
   SELECT ALL
============================================================ */

  () => {


    const round =
      managementRound.value;


    const available =
      getAvailableRackets(
        round
      );


    available.forEach(
      index => {


        tournamentState[
          round
        ][index] = true;

      }
    );


    saveTournament();


    renderManagement();


    populateRacketDropdowns();

  }
);



/* ============================================================
   DESELECT ALL
============================================================ */

deselectAllButton.addEventListener(
  "click",
  () => {


    const round =
      managementRound.value;


    const available =
      getAvailableRackets(
        round
      );


    available.forEach(
      index => {


        tournamentState[
          round
        ][index] = false;

      }
    );


    saveTournament();


    renderManagement();


    populateRacketDropdowns();

  }

/* ============================================================
   ROUND CHANGE
============================================================ */

managementRound.addEventListener(
  "change",
  () => {

      round1:

      round2:
        "round2.png",

      quarterfinal:

      semifinal:
        "semifinal.png",

    Automatically change
    the background.
    */

    backgroundSelect.value =
      background;



    templateImg.onload =

        renderManagement();


        populateRacketDropdowns();

      };


    templateImg.src =
      `images/${background}`;

  }
);



/* ============================================================
   RESET TOURNAMENT
============================================================ */

resetButton.addEventListener(
  "click",
  () => {


    const confirmed =
      confirm(
        "Reset the entire tournament? All rackets will be restored."
      );


    if (!confirmed) {

      return;

    }



    tournamentState = {};



    rounds.forEach(
      round => {


        tournamentState[
          round
        ] = {};


        rackets.forEach(
          (_, index) => {


            tournamentState[
              round
            ][index] = true;

          }
        );

      }
    );



    saveTournament();


    renderManagement();


    populateRacketDropdowns();

  }
);



/* ============================================================
   LOAD IMAGE
============================================================ */

function loadImage(src) {

  return new Promise(
    (resolve, reject) => {


      const image =
        new Image();


      image.onload =
        () => resolve(image);


      image.onerror =
        () => reject(
          new Error(
            "Could not load image: " +
            src
          )
        );


      image.src =
        src;

    }
  );

}



/* ============================================================
   CALCULATE RACKET SIZE
============================================================ */

function calculateRacketSize(
  image
) {


  const originalWidth =
    image.naturalWidth;


  const originalHeight =
    image.naturalHeight;



  const scale =
    Math.min(

      STANDARD_RACKET_WIDTH /
        originalWidth,

      STANDARD_RACKET_HEIGHT /
        originalHeight

    );



  const width =
    originalWidth * scale;


  const height =
    originalHeight * scale;



  const x =
    (
      STANDARD_RACKET_WIDTH -
      width
    ) / 2;


  const y =
    (
      STANDARD_RACKET_HEIGHT -
      height
    ) / 2;



  return {

    x,
    y,

    width,
    height

  };

}



/* ============================================================
   PLACE RACKET
============================================================ */

async function placeRacket(
  index,
  box
) {


  if (index === "") {

    return;

  }



  try {


    const racket =
      rackets[index];


    const image =
      await loadImage(
        racket.image
      );



    const racketSize =
      calculateRacketSize(
        image
      );



    /*
    Standard 375 × 600 frame.
    */

    const frameScale =
      Math.min(

        box.width /
          STANDARD_RACKET_WIDTH,

        box.height /
          STANDARD_RACKET_HEIGHT

      );



    const frameWidth =
      STANDARD_RACKET_WIDTH *
      frameScale;


    const frameHeight =
      STANDARD_RACKET_HEIGHT *
      frameScale;



    /*
    Center frame inside box.
    */

    const frameX =
      box.x +
      (
        box.width -
        frameWidth
      ) / 2;


    const frameY =
      box.y +
      (
        box.height -
        frameHeight
      ) / 2;



    /*
    Position racket inside frame.
    */

    const racketX =
      frameX +
      racketSize.x *
      frameScale;


    const racketY =
      frameY +
      racketSize.y *
      frameScale;


    const racketWidth =
      racketSize.width *
      frameScale;


    const racketHeight =
      racketSize.height *
      frameScale;



    /*
    Scale for browser preview.
    */

    const displayScale =
      templateImg.clientWidth /
      BASE_WIDTH;



    /*
    Create image.
    */

    const img =
      document.createElement(
        "img"
      );


    img.src =
      racket.image;


    img.alt =
      racket.name;


    img.className =
      "racket-image";


    img.style.left =
      `${racketX * displayScale}px`;


    img.style.top =
      `${racketY * displayScale}px`;


    img.style.width =
      `${racketWidth * displayScale}px`;


    img.style.height =
      `${racketHeight * displayScale}px`;



    racketLayer.appendChild(
      img
    );


  }

  catch (error) {


    console.error(
      "Error placing racket:",
      error
    );

  }

}



/* ============================================================
   UPDATE DISPLAY
============================================================ */

function updateDisplay() {


  racketLayer.innerHTML =
    "";


  placeRacket(
    racket1Select.value,
    racketBox1
  );


  placeRacket(
    racket2Select.value,
    racketBox2
  );

}

   BACKGROUND CHANGE
============================================================ */

backgroundSelect.addEventListener(
  "change",
  () => {


    templateImg.onload =
      () => {

        updateDisplay();

      };


    templateImg.src =
      `images/${backgroundSelect.value}`;

  }
);

   RACKET CHANGE
============================================================ */

racket1Select.addEventListener(
  "change",
  updateDisplay
);


racket2Select.addEventListener(
  "change",
  updateDisplay
);

   WINDOW RESIZE
============================================================ */

window.addEventListener(
  "resize",
  updateDisplay
);



/* ============================================================
   DOWNLOAD
============================================================ */

document
  .getElementById(
    "download-btn"
  )
  .addEventListener(
    "click",
    async () => {


      try {


        /*
        Create canvas.
        */

        const canvas =
          document.createElement(
            "canvas"
          );


        canvas.width =
          BASE_WIDTH;


        canvas.height =
          BASE_HEIGHT;


        const ctx =
          canvas.getContext(
            "2d"
          );



        /*
        Background.
        */

        const background =
          await loadImage(
            `images/${backgroundSelect.value}`
          );


        ctx.drawImage(
          background,
          0,
          0,
          BASE_WIDTH,
          BASE_HEIGHT
        );



        /*
        Draw racket.
        */

        async function drawRacket(
          index,
          box
        ) {


          if (index === "") {

            return;

          }



          const racket =
            rackets[index];


          const image =
            await loadImage(
              racket.image
            );



          const racketSize =
            calculateRacketSize(
              image
            );



          const frameScale =
            Math.min(

              box.width /
                STANDARD_RACKET_WIDTH,

              box.height /
                STANDARD_RACKET_HEIGHT

            );



          const frameWidth =
            STANDARD_RACKET_WIDTH *
            frameScale;


          const frameHeight =
            STANDARD_RACKET_HEIGHT *
            frameScale;



          const frameX =
            box.x +
            (
              box.width -
              frameWidth
            ) / 2;


          const frameY =
            box.y +
            (
              box.height -
              frameHeight
            ) / 2;



          const x =
            frameX +
            racketSize.x *
            frameScale;


          const y =
            frameY +
            racketSize.y *
            frameScale;


          const width =
            racketSize.width *
            frameScale;


          const height =
            racketSize.height *
            frameScale;



          ctx.drawImage(
            image,
            x,
            y,
            width,
            height
          );

        }



        /*
        First racket.
        */

        await drawRacket(
          racket1Select.value,
          racketBox1
        );



        /*
